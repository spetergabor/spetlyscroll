name: Build Spetlyscroll for macOS

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Apple Silicon app
        run: npm run desktop:build
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: Spetlyscroll-macOS-arm64
          path: |
            outputs/desktop/*.dmg
            outputs/desktop/*.zip
